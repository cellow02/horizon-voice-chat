name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The copies of the shared sources in all four mods are up to date
        run: tools/sync-protocol.sh --check
      - name: Protocol, client and server network code, both AES-GCM and Opus implementations against each other
        run: cargo test --manifest-path interop-tests/Cargo.toml
