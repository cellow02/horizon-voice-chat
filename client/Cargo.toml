[package]
name = "mod-horizon-voice"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build).
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
log = "0.4"
# Opus: libopus translated to Rust, so players need no C compiler.
unsafe-libopus = "=0.2.0"
# Packet encryption (AES-128-GCM).
aes-gcm = "=0.10.3"
getrandom = "=0.2.17"

# Microphone and speakers. On Linux the prebuilt game already links ALSA, and a mod may not compile
# a second provider of it (alsa-sys), so the mod opens the game's libasound at runtime instead
# (src/sound_alsa.rs). The versions are the game's.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "=0.8.9"
libc = "=0.2.190"

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "=0.16.0"
