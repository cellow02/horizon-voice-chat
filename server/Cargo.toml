[package]
name = "mod-horizon-voice-server"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build).
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
log = "0.4"
# Packet encryption (AES-128-GCM) and the address-check nonce (HMAC-SHA256).
aes-gcm = "=0.10.3"
getrandom = "=0.2.17"
hmac = "=0.12.1"
sha2 = "=0.10.9"
